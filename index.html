<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="calculator" aria-label="Calculator">
            <header class="calculator__header">
                <div>
                    <p class="eyebrow">EVERYDAY TOOL</p>
                    <h1>Calculator</h1>
                </div>
                <span class="calculator__badge" aria-hidden="true">＋</span>
            </header>

            <div class="display" aria-live="polite" aria-atomic="true">
                <div class="display__previous" id="previous-display"></div>
                <output class="display__current" id="current-display" aria-label="Current value">0</output>
            </div>

            <div class="keypad" aria-label="Calculator keys">
                <button class="key key--utility" type="button" data-action="clear" aria-label="Clear">AC</button>
                <button class="key key--utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
                <button class="key key--utility" type="button" data-action="percent" aria-label="Percent">%</button>
                <button class="key key--operator" type="button" data-operator="/" aria-label="Divide">÷</button>

                <button class="key" type="button" data-number="7">7</button>
                <button class="key" type="button" data-number="8">8</button>
                <button class="key" type="button" data-number="9">9</button>
                <button class="key key--operator" type="button" data-operator="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-number="4">4</button>
                <button class="key" type="button" data-number="5">5</button>
                <button class="key" type="button" data-number="6">6</button>
                <button class="key key--operator" type="button" data-operator="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-number="1">1</button>
                <button class="key" type="button" data-number="2">2</button>
                <button class="key" type="button" data-number="3">3</button>
                <button class="key key--operator" type="button" data-operator="+" aria-label="Add">+</button>

                <button class="key key--zero" type="button" data-number="0">0</button>
                <button class="key" type="button" data-action="decimal">.</button>
                <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>
            </div>
            <p class="calculator__hint">Use your keyboard or tap the keys</p>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
